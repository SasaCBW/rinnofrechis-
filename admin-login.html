<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administração | Rinno Frenchies</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin-login.css">
</head>
<body class="login-page">
<main class="login-card">
<a href="index.html" class="login-brand">
<small>RINNO</small>
<strong>Frenchies</strong>
</a>
<h1>Painel <em>administrativo.</em></h1>
<p>Entre com sua conta autorizada para gerenciar o site.</p>
<form id="login-form">
<label class="field">E-mail
<input type="email" id="email" required autocomplete="username"></label>
<label class="field">Senha
<input type="password" id="password" required autocomplete="current-password"></label>
<button class="btn btn-wine" type="submit">Entrar no painel ↗</button>
<p class="form-message" id="login-status" role="status"></p>
</form>
<a class="back-link" href="index.html">← Voltar ao site</a>
</main>
<script type="module" src="js/admin-login.js"></script>
</body>
</html>
